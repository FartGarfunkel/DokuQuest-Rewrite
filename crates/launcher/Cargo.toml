[package]
name = "launcher"
version.workspace = true
edition = "2021"
description = "DokuQuest launcher: auto-updates the game from GitHub Releases, then starts it"

[[bin]]
name = "dokuquest-launcher"
path = "src/main.rs"

[dependencies]
common_server = { path = "../common_server" }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
