[package]
name = "launcher"
version.workspace = true
edition = "2021"
description = "DokuQuest launcher: the 0.9 launcher page in a Rust (Tauri) window; auto-updates the game from GitHub Releases"

[[bin]]
name = "dokuquest-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
common_server = { path = "../common_server" }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
