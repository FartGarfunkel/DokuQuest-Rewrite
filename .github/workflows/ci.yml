name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p common_server
      - run: cargo check --workspace

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 mesa-vulkan-drivers xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p game_engine
      - name: Play a scripted session on software Vulkan
        env:
          DQ_SMOKE: '1'
          RUST_BACKTRACE: '1'
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 900 ./target/release/dokuquest > smoke.log 2>&1
          code=$?
          last=$(grep -o "SMOKE step [0-9]* at [0-9.]*s" smoke.log | tail -1)
          if grep -q "SMOKE OK" smoke.log; then echo "::notice::SMOKE OK ($last)"; exit 0; fi
          msg=$(grep -A6 "panicked" smoke.log | head -8 | tr '\n' ' ' | cut -c1-1500)
          [ -z "$msg" ] && msg=$(grep -E "ERROR|error" smoke.log | tail -6 | tr '\n' ' ' | cut -c1-1500)
          [ -z "$msg" ] && msg=$(tail -10 smoke.log | tr '\n' ' ' | cut -c1-1500)
          echo "::error::exit=$code last=[$last] :: $msg"
          exit 1
