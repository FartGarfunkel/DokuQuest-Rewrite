# Every push to main publishes its own release (v0.2.<run number>), like the HTML version:
# Linux + Windows builds, the launcher AppImage, SHA-256 files. The launcher installs the newest one.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  DQ_VERSION: v0.2.${{ github.run_number }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64, ext: '' }
          - { os: windows-latest, target: windows-x86_64, ext: '.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg dist
          cp target/release/dokuquest${{ matrix.ext }} target/release/dq-server${{ matrix.ext }} pkg/
          tar -czf dist/dokuquest-${{ matrix.target }}.tar.gz -C pkg .
          (cd dist && sha256sum dokuquest-${{ matrix.target }}.tar.gz > dokuquest-${{ matrix.target }}.tar.gz.sha256)
          cp target/release/dokuquest-launcher${{ matrix.ext }} dist/dokuquest-launcher-${{ matrix.target }}${{ matrix.ext }}
      - name: Launcher AppImage
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          cd crates/launcher && npx --yes @tauri-apps/cli@2 build --bundles appimage
          cp ../../target/release/bundle/appimage/*.AppImage ../../dist/DokuQuest-Launcher-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DQ_VERSION }}
          name: DokuQuest ${{ env.DQ_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            Removed Herobrine.
          files: dist/*
