# Android: builds the DokuQuest APK (64-bit ARM phones) for every push to the `android` branch, or by hand
# (Actions → Android → Run workflow), with tools/android/build_apk.sh. The APK is kept as the run's artifact and
# published as the pre-release "android-latest" (replaced by each build). A pre-release is never GitHub's "latest"
# release, so the desktop launcher's updater (src/launcher/updater.cpp, /releases/latest) never sees it.
name: Android
on:
  push:
    branches: [android]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache zip
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-
      - name: Fetch dependencies
        run: bash tools/fetch_deps.sh
      - name: Build the APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ccache -M 2G; ccache -z
          # a private signing key, if one is stored in the repository's secrets; else android/debug.keystore
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore" ANDROID_KEYSTORE_PASS="$ANDROID_KEYSTORE_PASS_SECRET" ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS_SECRET"
          fi
          export VERSION_CODE=$(( ($(date -u +%s) - 1767225600) / 60 ))
          # every compiler or linker error becomes an annotation (readable through the API)
          set +e; bash tools/android/build_apk.sh 2>&1 | tee build.log; rc=${PIPESTATUS[0]}; set -e
          grep -E "error:|error |undefined (reference|symbol)|FAILED:|cannot find|No such file" build.log | grep -v "^ccache" | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:500}"; done
          grep -E "^(DokuQuest |  NDK|  needs:|  [0-9.]+[KMG] built|  [0-9]+ files|APK:|package:|sdkVersion|targetSdkVersion|native-code|Verified)" build.log | while IFS= read -r l; do echo "::notice::${l:0:400}"; done
          ccache -s | head -6
          exit $rc
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: DokuQuest-android-arm64
          path: dist/android/*.apk
          if-no-files-found: error
      - name: Publish (pre-release android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls dist/android/*.apk)
          build=$(cat dist/android/build-arm64.txt)
          size=$(du -h "$apk" | cut -f1)
          {
            echo "**$build**: DokuQuest for Android, a test build from the \`${GITHUB_REF_NAME}\` branch (\`${GITHUB_SHA::7}\`)."
            echo
            echo "### Install"
            echo "- Download **$(basename "$apk")** ($size) below on the phone and open it (allow installing from your browser or Files when Android asks)."
            echo "- An older DokuQuest APK signed by someone else (an earlier test build) has to be uninstalled first; later builds from here install over this one and keep your worlds."
            echo "- The first start unpacks the game's files (a few seconds of black screen)."
            echo
            echo "### Phones"
            echo "- 64-bit ARM (arm64-v8a), Android 8 or newer."
            echo "- Vulkan 1.3 draws the game where the phone has it (Android 13+ on a recent phone: Pixel 9a, Pixel 10, ...)."
            echo "- Older phones (Android 12 and before, e.g. a Galaxy Note 10+) draw with OpenGL ES 3 instead, automatically."
            echo "- Options → Video → Renderer switches between Vulkan and OpenGL ES (from the next start). If Vulkan ever stops the game as it starts, the next start uses OpenGL ES by itself."
            echo
            echo "### Playing"
            echo "- Touch: the stick bottom left moves (push past its ring, or tap Sprint, to sprint); drag anywhere else to look."
            echo "- Tap a block to use it or place on it, tap a monster to hit it, hold on a block to mine it (or aim with the centre crosshair: Options → Controls → Touch → Touch Aiming)."
            echo "- Buttons: Jump, Mine, Use (hold to eat or draw a bow), Sneak (on / off), Cast (your quick spell), Dodge; Drop (hold: the stack) and Swap by the hotbar; Pause, Bag, More, Map, Journal, Spells, Chat along the top. More has everything else (skills, spells, companions, crawl, placing mode, camera, zoom, pick block, photo mode, ...). Tap the hotbar to pick a slot."
            echo "- In the bag: tap to take or put, hold for half a stack (or one), double tap to quick-move, drag an item to carry it to another slot (or off the panel to throw it)."
            echo "- Touch controls: Auto (hidden while a controller is connected), On or Off, plus button size, opacity and look speed, in Options → Controls → Touch. A controller plays everything, menus included. In menus a finger is the pointer, and dragging a list scrolls it."
            echo "- Back button / back gesture = Escape (pause, close a menu)."
            echo "- Starts on the Low graphics preset; raise it in Options → Video."
            echo "- Your folder (worlds, settings, resource packs, screenshots, latest.log): Android/data/org.dokuquest.app/files, reachable from a computer over USB."
            echo
            echo "- Removed Herobrine."
          } > notes.md
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest "$apk" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "DokuQuest for Android (test build)" --notes-file notes.md
          echo "::notice::published $(basename "$apk") as the android-latest pre-release"

  emulator:
    # The same game built for x86_64 and run in an Android emulator (software Vulkan, tools/android/emulator_test.sh):
    # it installs, unpacks its files and shows the title screen, then plays a new world for 300 frames. It checks the
    # build; the phone APK above is published whatever this finds.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache zip python3-pil
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-x86_64-${{ github.sha }}
          restore-keys: ccache-android-x86_64-
      - name: Fetch dependencies
        run: bash tools/fetch_deps.sh
      - name: Build the x86_64 APK
        env:
          ABI: x86_64
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ccache -M 2G; ccache -z
          set +e; bash tools/android/build_apk.sh 2>&1 | tee build.log; rc=${PIPESTATUS[0]}; set -e
          grep -E "error:|error |undefined (reference|symbol)|FAILED:|cannot find|No such file" build.log | grep -v "^ccache" | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:500}"; done
          exit $rc
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ccache-android-x86_64-${{ github.sha }}
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run it in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/android/emulator_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test
          path: emulator-test/
          if-no-files-found: ignore

  vulkan-validation:
    # The Vulkan renderer (what phones draw with) run on the PC build under the Khronos validation layer, with Mesa's
    # software Vulkan: a new world and the tree playtest. Every rule it breaks is listed (desktop drivers forgive
    # much that phone drivers need not). It checks the code; nothing is published from here.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Packages (SDL backends, Mesa Vulkan, the validation layer, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libgles-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            xvfb xauth libgl1-mesa-dri mesa-vulkan-drivers vulkan-validationlayers libvulkan1 ccache
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-Linux-${{ github.sha }}
          restore-keys: ccache-Linux-
      - name: Fetch dependencies
        run: bash tools/fetch_deps.sh
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache > /dev/null
          cmake --build build --target dokuquest 2>&1 | tail -3
      - name: Run on Vulkan under validation
        run: |
          ud="$RUNNER_TEMP/ud"; mkdir -p "$ud"
          echo '{"preset":"custom","renderDist":4,"farTerrain":256,"shadows":0,"waterQuality":0,"clouds":true,"portalViews":false,"scale":0.5,"particles":1,"weatherParticles":0,"microVoxels":0,"plantDetail":"flat","shaderLevel":0,"fancyLeaves":false,"volumetricClouds":false}' > "$ud/settings.json"
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1); echo "lavapipe: $icd"
          export VK_ICD_FILENAMES="$icd" VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LOADER_LAYERS_ENABLE='*validation*'
          run() { timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" "$@" > run.log 2>&1; echo "exit $?"; cat run.log >> all.log; }
          run ./build/dokuquest --userdir "$ud" --renderer vulkan --create Test --seed hello --smoke-frames 200
          run ./build/dokuquest --userdir "$ud" --renderer vulkan --world Test --smoke-frames 3000 --smoke-script tools/playtests/tree.json
          grep -c "Validation Error" all.log || true
          grep -o -E "VUID-[A-Za-z0-9_-]+" all.log | sort | uniq -c | sort -rn | head -40 | while read -r n v; do echo "::warning::validation: $v x$n"; done
          # one example message of each, in the log
          for v in $(grep -o -E "VUID-[A-Za-z0-9_-]+" all.log | sort -u | head -40); do echo "== $v"; grep -m1 "$v" all.log | cut -c1-900; done
          grep -E "TEST (PASS|FAIL|DONE)|crashed|uncaught" all.log | head -20 || true
          grep -q "Validation" all.log || echo "::notice::validation: no errors"

  # the APK goes on the version's release too (v<version>, beside the Windows and Linux downloads), only once the
  # emulator run has passed: a build that crashes there stays on android-latest alone
  attach:
    needs: [apk, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DokuQuest-android-arm64
          path: dist
      - name: Add the APK to the version's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls dist/*.apk | head -1)
          v=$(basename "$apk" | sed -E 's/^DokuQuest-(.*)-android-arm64\.apk$/\1/')
          # (the PC release may still be building: wait for it, up to 50 minutes)
          for i in $(seq 1 50); do gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 60; done
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$v" "$apk" --clobber -R "$GITHUB_REPOSITORY"
            echo "::notice::added $(basename "$apk") to the v$v release"
          else
            echo "::warning::no v$v release yet: the APK is on android-latest only (tag the PC release first)"
          fi
