# Android: builds the DokuQuest APK (64-bit ARM phones) for every push to the `android` branch, or by hand
# (Actions → Android → Run workflow), with tools/android/build_apk.sh. The APK is kept as the run's artifact and
# published as the pre-release "android-latest" (replaced by each build). A pre-release is never GitHub's "latest"
# release, so the desktop launcher's updater (src/launcher/updater.cpp, /releases/latest) never sees it.
name: Android
on:
  push:
    branches: [android]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache zip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-
      - name: Fetch dependencies
        run: bash tools/fetch_deps.sh
      - name: Build the APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ccache -M 2G; ccache -z
          # a private signing key, if one is stored in the repository's secrets; else android/debug.keystore
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore" ANDROID_KEYSTORE_PASS="$ANDROID_KEYSTORE_PASS_SECRET" ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS_SECRET"
          fi
          export VERSION_CODE=$(( ($(date -u +%s) - 1767225600) / 60 ))
          # every compiler or linker error becomes an annotation (readable through the API)
          set +e; bash tools/android/build_apk.sh 2>&1 | tee build.log; rc=${PIPESTATUS[0]}; set -e
          grep -E "error:|error |undefined (reference|symbol)|FAILED:|cannot find|No such file" build.log | grep -v "^ccache" | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:500}"; done
          grep -E "^(DokuQuest |  NDK|  needs:|  [0-9.]+[KMG] built|  [0-9]+ files|APK:|package:|sdkVersion|targetSdkVersion|native-code|Verified)" build.log | while IFS= read -r l; do echo "::notice::${l:0:400}"; done
          ccache -s | head -6
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: DokuQuest-android-arm64
          path: dist/android/*.apk
          if-no-files-found: error
      - name: Publish (pre-release android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls dist/android/*.apk)
          build=$(cat dist/android/build.txt)
          size=$(du -h "$apk" | cut -f1)
          {
            echo "**$build**: DokuQuest for Android, a test build from the \`${GITHUB_REF_NAME}\` branch (\`${GITHUB_SHA::7}\`)."
            echo
            echo "### Install"
            echo "- Download **$(basename "$apk")** ($size) below on the phone and open it (allow installing from your browser or Files when Android asks)."
            echo "- An older DokuQuest APK signed by someone else (an earlier test build) has to be uninstalled first; later builds from here install over this one and keep your worlds."
            echo "- The first start unpacks the game's files (a few seconds of black screen)."
            echo
            echo "### Phones"
            echo "- Needs Vulkan 1.3: Android 13 or newer on a recent phone (Pixel 9a and Pixel 10 have it). Older phones show a message saying so."
            echo "- 64-bit ARM (arm64-v8a)."
            echo
            echo "### Playing"
            echo "- A controller (Bluetooth or USB) plays everything, menus included. Touch works as a mouse in the menus."
            echo "- Back button / back gesture = Escape (pause, close a menu)."
            echo "- Starts on the Low graphics preset; raise it in Options → Video."
            echo "- Your folder (worlds, settings, resource packs, screenshots, latest.log): Android/data/org.dokuquest.app/files, reachable from a computer over USB."
            echo
            echo "- Removed Herobrine."
          } > notes.md
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest "$apk" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "DokuQuest for Android (test build)" --notes-file notes.md
          echo "::notice::published $(basename "$apk") as the android-latest pre-release"
